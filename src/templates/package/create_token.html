{{define "content"}}
{{template "package_header" .}}

<div class="row">
  <div class="col-sm-4 col-md-3 hidden-xs">
    {{template "pkg_infopanel" .}}
  </div>

  <div class="col-xs-12 col-sm-8 col-md-9">

{{template "package_title" .}}

    <h4>Direct Install URL</h4>
    <p><a href="{{.Data.URL}}">{{.Data.URL}}</a>
      <button class="btn btn-default copy"><i class="fa fa-copy"></i></button>
      <span style="position:relative;top:-3em;left:-4.8em;display:none" class="label label-info">Copied!</span>
    </p>
    <dl class="dl-horizontal">
      <dt>Expired at</dt>
      <dd>{{.Data.Expire}}</dd>
      <dt>Generated by</dt>
      <dd>{{.Data.GeneratedBy}}</dd>
    </dl>
    <p class="text-center">
      <img src="{{$.QR .Data.QRPath 250}}">
    </p>

  </div>
</div>

<div class="visible-xs">
  {{template "pkg_infopanel" .}}
</div>
<script type="text/javascript">
$('button.copy').on('click', function(event){
    var area = document.createElement('textarea');
    area.style.border = '0';
    area.style.padding = '0';
    area.style.height = '1px';
    area.style.width = '1px';
    area.style.position = 'relative';
    area.style.left = '-1px';
    area.style.overflow = 'hidden';
    area.innerText = $(this).prev().text();
    this.appendChild(area);
    area.focus();
    area.select();
    document.execCommand("copy");
    this.removeChild(area);

    $(this).next().show().delay(500).fadeOut("slow");
});
</script>
{{end}}
