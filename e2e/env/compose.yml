# E2E テスト用の環境 (PHP 版).
# リポジトリ直下から: docker compose -f e2e/env/compose.yml up -d --build
# 実際の起動は e2e/env/up.sh を使う.
name: emlauncher-e2e

services:
  db:
    image: mysql:5.7.44
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: emlauncher
      MYSQL_USER: emlauncher
      MYSQL_PASSWORD: emlauncher
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - ../../sql/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
    ports:
      - "${E2E_DB_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uemlauncher", "-pemlauncher"]
      interval: 2s
      timeout: 5s
      retries: 60

  memcached:
    image: memcached:1.6.32
    ports:
      - "${E2E_MEMCACHED_PORT:-21211}:11211"

  s3:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      DEFAULT_REGION: ap-northeast-1
    ports:
      - "${E2E_S3_PORT:-14566}:4566"

  php:
    build: ./php
    environment:
      # e2e_local (LocalFile) / e2e_s3 (S3)
      MFW_ENV: ${E2E_ENV:-e2e_local}
      PHP_TZ: ${E2E_TZ:-Asia/Tokyo}
      E2E_S3_EXTERNAL_URL: http://localhost:${E2E_S3_PORT:-14566}
    # PHP 版のソースは e2e/env/php-src.sh で過去のコミットから取り出したもの (.work/php-src).
    # APP_ROOT は /srv/emlauncher. ディレクトリ名は memcached のキー接頭辞に入る
    # (本番と同じ "emlauncher" にしている). config/ だけ E2E 用に差し替える.
    volumes:
      - ../.work/php-src/initialize.php:/srv/emlauncher/initialize.php:ro
      - ../.work/php-src/web:/srv/emlauncher/web:ro
      - ../.work/php-src/mainmodules:/srv/emlauncher/mainmodules:ro
      - ../.work/php-src/model:/srv/emlauncher/model:ro
      - ../.work/php-src/data:/srv/emlauncher/data:ro
      - ../.work/php-src/batch:/srv/emlauncher/batch:ro
      - ../.work/php-src/mfw:/srv/emlauncher/mfw:ro
      - ../.work/php-src/vendor:/srv/emlauncher/vendor:ro
      - ./php/config:/srv/emlauncher/config:ro
      - ../.work/files:/var/www/emlauncher
      - ../.work/mailbox:/mailbox
    ports:
      - "${E2E_PHP_PORT:-18081}:80"
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
      s3:
        condition: service_started

  # Go 版 (e2e/env/up-go.sh で起動する). PHP 版と同じ DB・memcached・ストレージ・メールボックスを使う.
  go:
    profiles: ["go"]
    build:
      context: ../..
      dockerfile: e2e/env/go/Dockerfile
    image: emlauncher-e2e-go
    init: true
    # 移行リハーサルでは Apache と同じユーザ (www-data) で動かす
    user: "${E2E_GO_USER:-0:0}"
    environment:
      E2E_ENV: ${E2E_ENV:-e2e_local}
      TZ: ${E2E_TZ:-Asia/Tokyo}
    volumes:
      # 既定は e2e/env/go/ の設定のコピー (テストが書き換えるため. up-go.sh がコピーする).
      # 移行リハーサルでは PHP 版の設定から作った設定を使う
      - ${E2E_GO_CONFIG_DIR:-../.work/go-runtime-config}:/etc/emlauncher:ro
      # PHP 版と同じホストにある DB の authfile (PHP 版のイメージの /dbauth と同じ内容)
      - ./go/dbauth:/dbauth:ro
      - ../.work/files:/var/www/emlauncher
      - ../.work/mailbox:/mailbox
    ports:
      - "${E2E_GO_PORT:-18082}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Go 版を systemd の下で動かす (e2e/env/up-systemd.sh で起動する). ユニットファイルと systemctl reload の確認用.
  systemd:
    profiles: ["systemd"]
    build:
      context: ../..
      dockerfile: e2e/env/systemd/Dockerfile
    image: emlauncher-e2e-systemd
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ${E2E_GO_CONFIG_DIR:-../.work/go-runtime-config}/config.${E2E_ENV:-e2e_local}.yml:/etc/emlauncher/config.yml:ro
      - ../.work/files:/var/www/emlauncher
      - ../.work/mailbox:/mailbox
    ports:
      - "${E2E_SYSTEMD_PORT:-18083}:8080"
    depends_on:
      db:
        condition: service_healthy
