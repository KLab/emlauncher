PassEnv MFW_ENV
PassEnv E2E_S3_EXTERNAL_URL

<VirtualHost *:80>
	DocumentRoot /srv/emlauncher/web
	<Directory /srv/emlauncher/web>
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined

	Alias /files /var/www/emlauncher
	<Directory /var/www/emlauncher>
		Require all granted
	</Directory>
</VirtualHost>
